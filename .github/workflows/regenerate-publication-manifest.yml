name: regenerate-publication-manifest

on:
  pull_request:
    branches: [main]

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Regenerate manifest
        run: python3 scripts/build_publication_manifest.py
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-publication-manifest
          path: releases/publication-state-manifest.json
          if-no-files-found: error
