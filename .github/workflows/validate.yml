name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # tiktoken==0.9.0 is preregistered and supports Python through 3.13.
          python-version: "3.13"
      - name: Install deterministic Python dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Generate refreshed publication manifest
        run: python3 scripts/build_publication_manifest.py
      - name: Upload refreshed publication manifest
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-publication-manifest
          path: releases/publication-state-manifest.json
          if-no-files-found: error
      - name: Run test suite
        run: python3 -m pytest -q
      - name: Install TeX Live publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended
      - name: Validate repository topology, syntax, and publications
        run: python3 scripts/validate.py
      - name: Check registries
        run: python3 scripts/check_registry.py
      - name: Check dataset freshness
        run: python3 scripts/build_dataset.py --check
      - name: Check analysis freshness
        run: python3 scripts/build_analysis.py --check
      - name: Check report build entry point
        run: python3 scripts/build_report.py
      - name: Check retained-classification freshness
        run: python3 scripts/build_retained_classification.py --check
      - name: Check cohort-conclusion freshness
        run: python3 scripts/build_cohort_conclusion.py --check
      - name: Check publication-state manifest
        run: python3 scripts/build_publication_manifest.py --check
      - name: Build publication PDFs
        run: python3 scripts/build_papers.py
      - name: Verify publication PDF artifacts
        run: |
          set -euo pipefail
          mapfile -t expected < <(python3 - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location("build_papers", root / "scripts" / "build_papers.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules["build_papers"] = module
          spec.loader.exec_module(module)
          for paper in module.discover_papers():
              print(f"releases/papers/{paper.name}.pdf")
          PY
          )
          mapfile -t actual < <(find releases/papers -maxdepth 1 -type f -name '*.pdf' -print | sort)
          if [ "${#expected[@]}" -eq 0 ]; then
            echo "no expected publication PDFs discovered" >&2
            exit 1
          fi
          if [ "${#actual[@]}" -ne "${#expected[@]}" ]; then
            printf 'expected PDFs:\n%s\n' "${expected[@]}" >&2
            printf 'actual PDFs:\n%s\n' "${actual[@]}" >&2
            exit 1
          fi
          for i in "${!expected[@]}"; do
            if [ "${actual[$i]}" != "${expected[$i]}" ]; then
              echo "publication PDF set mismatch at index $i: expected ${expected[$i]}, got ${actual[$i]}" >&2
              exit 1
            fi
            if [ ! -s "${expected[$i]}" ]; then
              echo "empty publication PDF: ${expected[$i]}" >&2
              exit 1
            fi
            echo "verified non-empty publication PDF: ${expected[$i]}"
          done
      - name: Run CI-bound B2 publication-readiness audit
        run: |
          mkdir -p reports
          python3 scripts/audit_b2_publication_readiness.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --output reports/b2-publication-readiness.md \
            --verify-pdfs
      - name: Upload publication PDFs
        uses: actions/upload-artifact@v4
        with:
          name: publication-pdfs
          path: releases/papers/*.pdf
          if-no-files-found: error
      - name: Upload CI-bound audit report
        uses: actions/upload-artifact@v4
        with:
          name: b2-publication-readiness-audit
          path: reports/b2-publication-readiness.md
          if-no-files-found: error
      - name: Check whitespace
        run: git diff --check
